; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n8r8]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

monitor_dtr = 1
monitor_rts = 1
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	
	; --- TFT_eSPI CONFIGURATION ---
	-D USER_SETUP_LOADED=1
	-D ILI9488_DRIVER=1
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D USE_HSPI_PORT=1
	-D TFT_MOSI=11
	-D TFT_MISO=13
	-D TFT_SCLK=12
	-D TFT_CS=15
	-D TFT_DC=4
	-D TFT_RST=5
	-D TOUCH_CS=6
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000

	; WARNING SUPPRESSION
	-Wno-deprecated-declarations
	-Wno-error=deprecated-declarations

	;BLE MEMORY SAVING FLAGS (for less ram use)
    -DNIMBLE_CPP_DISABLE_CONN_DB=1
    ;-DNIMBLE_CPP_DISABLE_SERVER=1


lib_deps = 
	links2004/WebSockets@^2.7.3
	bodmer/TFT_eSPI @ ^2.5.43
	tttapa/Control Surface @ ^2.1.0
	max22/ESP32-BLE-MIDI@^0.4.0
	h2zero/NimBLE-Arduino @ ^2.5.0

;Instructs pioarduino to ignore the ESP32-BLE-MIDI library's internal example file
build_src_filter = +<*> -<.pio/libdeps/esp32-s3-n8r8/ESP32-BLE-MIDI/src/main.cpp>